<style>
#kjomo{width:100%;max-width:1100px;margin:0 auto}
#kjomo video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#111315;border-radius:4px;box-shadow:0 30px 80px -30px #000}
#kjomo.hoch video{aspect-ratio:9/16;width:min(100%,430px);margin:0 auto}
</style>
<div id="kjomo" hidden><video muted playsinline loop preload="none" aria-label="Kurzvideo DJ KOLJA ONE: Anlässe, Leistungen, Einsatzgebiet und wie ihr euren Termin bucht"></video></div>
<script>
(function(){function go(){var r=document.getElementById("kjomo");if(!r||r.dataset.on)return;r.dataset.on=1;
var M=window.KJO_MEDIA||{},hoch=matchMedia("(max-width:767px)").matches,e=(hoch&&M.start_motion_hoch)||M.start_motion||M.start_motion_hoch;
if(!e||!e.vid){var s=r.closest(".e-con:not(.e-child)");(s||r).style.display="none";return}
if(e===M.start_motion_hoch)r.classList.add("hoch");
var v=r.querySelector("video");if(e.img)v.poster=e.img;r.hidden=false;
/* stumm, Endlosschleife; lädt erst, wenn es ins Bild kommt, und pausiert außerhalb */
var red=matchMedia("(prefers-reduced-motion: reduce)").matches;if(red){v.controls=true;v.preload="metadata";v.src=e.vid;return}
function on(){if(!v.src)v.src=e.vid;var p=v.play();if(p&&p.catch)p.catch(function(){v.controls=true})}
if("IntersectionObserver" in window)new IntersectionObserver(function(x){x.forEach(function(y){if(y.isIntersecting)on();else v.pause()})},{threshold:.25}).observe(v);else on()}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",go);else go()})();
</script>
