<style>
#kjv{width:100%;max-width:1200px;margin:0 auto;font-family:"Fira Sans",sans-serif}
#kjv .vs{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
#kjv .vt{position:relative;flex:0 0 calc(25% - 15px);min-width:0;border:0;padding:0;background:#1A1712;cursor:pointer;overflow:hidden;border-radius:3px;aspect-ratio:9/16;box-shadow:0 14px 34px rgba(0,0,0,.45);outline:1px solid rgba(178,157,117,.25);outline-offset:-1px;transition:transform .35s ease,outline-color .35s ease}
#kjv .vt:hover,#kjv .vt:focus-visible{transform:translateY(-5px);outline-color:#B29D75}
#kjv .vt video,#kjv .vt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
#kjv .vt:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,12,7,0) 55%,rgba(15,12,7,.55));pointer-events:none}
#kjv .pb{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:1.5px solid #F3F1E9;background:rgba(15,12,7,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:2;transition:background .3s,transform .3s,border-color .3s}
#kjv .pb:before{content:"";position:absolute;left:25px;top:20px;border-style:solid;border-width:12px 0 12px 19px;border-color:transparent transparent transparent #F3F1E9}
#kjv .vt:hover .pb,#kjv .vt:focus-visible .pb{background:#B29D75;border-color:#B29D75;transform:scale(1.08)}
#kjv .vt:hover .pb:before,#kjv .vt:focus-visible .pb:before{border-left-color:#0F0C07}
#kjv .lb{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(8,6,3,.94);padding:24px}
#kjv .lb.on{display:flex}
#kjv .lb video{max-width:100%;max-height:100%;background:#000;border-radius:3px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
#kjv .lb .x{position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:50%;border:1.5px solid #F3F1E9;background:rgba(15,12,7,.6);cursor:pointer;padding:0}
#kjv .lb .x:before,#kjv .lb .x:after{content:"";position:absolute;left:12px;top:21px;width:20px;height:1.5px;background:#F3F1E9;transform:rotate(45deg)}
#kjv .lb .x:after{transform:rotate(-45deg)}
@media(max-width:767px){
#kjv .vs{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:4px 20px 18px;margin:0 -20px;gap:14px;scrollbar-width:none}
#kjv .vs::-webkit-scrollbar{display:none}
#kjv .vt{flex:0 0 66%;scroll-snap-align:center}
#kjv .pb{width:56px;height:56px;margin:-28px 0 0 -28px}
#kjv .pb:before{left:22px;top:17px;border-width:11px 0 11px 17px}}
#kjv .lb img{max-width:100%;max-height:100%;border-radius:3px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
#kjv .vt.im .pb{display:none}
</style>
<div id="kjv" data-key="__KEY__" hidden>
<div class="vs"></div>
<div class="lb" role="dialog" aria-modal="true" aria-label="Galerie"><button class="x" aria-label="Schließen"></button><video controls playsinline preload="none" hidden></video><img alt="" hidden></div>
</div>
<script>
(function(){function go(){var r=document.getElementById("kjv");if(!r||r.dataset.on)return;r.dataset.on=1;
var key=r.dataset.key,M=window.KJO_MEDIA||{},row=r.querySelector(".vs"),lb=r.querySelector(".lb"),lv=lb.querySelector("video"),li=lb.querySelector("img"),n=0,last=null;
function close(){lb.classList.remove("on");try{lv.pause()}catch(e){}lv.removeAttribute("src");lv.load();li.removeAttribute("src");document.documentElement.style.overflow="";if(last)try{last.focus()}catch(e){}}
function open(e,b){last=b;lv.hidden=!e.vid;li.hidden=!!e.vid;if(e.vid){lv.src=e.vid;lv.muted=false;var p=lv.play();if(p&&p.catch)p.catch(function(){lv.muted=true;lv.play().catch(function(){})})}else li.src=e.img;lb.classList.add("on");document.documentElement.style.overflow="hidden"}
for(var i=1;i<=8;i++)(function(i){var e=M["event_"+key+"_"+i];if(!e||!(e.vid||e.img))return;n++;
var b=document.createElement("button"),pb=document.createElement("span");b.className="vt";b.type="button";pb.className="pb";b.setAttribute("aria-label",(e.vid?"Video ":"Bild ")+i+" öffnen");
if(e.vid){var v=document.createElement("video");v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");v.preload="metadata";v.loop=true;if(e.img)v.poster=e.img;v.src=e.vid+"#t=0.3";
v.addEventListener("loadedmetadata",function(){if(v.videoWidth&&v.videoHeight)b.style.aspectRatio=v.videoWidth+"/"+v.videoHeight});
b.addEventListener("mouseenter",function(){if(matchMedia("(hover:hover)").matches){var p=v.play();if(p&&p.catch)p.catch(function(){})}});
b.addEventListener("mouseleave",function(){v.pause();try{v.currentTime=.3}catch(x){}});
b.appendChild(v);b.appendChild(pb);b.addEventListener("click",function(){v.pause();open(e,b)})}
else{var im=document.createElement("img");im.alt="";im.loading="lazy";im.src=e.img;b.className="vt im";b.appendChild(im);im.addEventListener("load",function(){if(im.naturalWidth)b.style.aspectRatio=im.naturalWidth+"/"+im.naturalHeight});b.addEventListener("click",function(){open(e,b)})}
row.appendChild(b)})(i);
if(!n){var s=r.closest(".e-con:not(.e-child)");(s||r).style.display="none";return}
r.hidden=false;
lb.querySelector(".x").addEventListener("click",close);
lb.addEventListener("click",function(e){if(e.target===lb)close()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&lb.classList.contains("on"))close()})}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",go);else go()})();
</script>
