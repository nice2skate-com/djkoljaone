<!-- DJ KOLJA ONE · Interaktives DJ-Deck · in Elementor per HTML-Widget einfügen -->
<div id="kjo" aria-label="Interaktives DJ-Pult: Wähle eine Platte aus der Kiste und halte sie an, um mehr zu erfahren">
<style>

#kjo *{box-sizing:border-box}#kjo,#kjo *,#kjo svg text{font-family:'Fira Sans',sans-serif!important}
#kjo .top{display:flex;justify-content:center;align-items:center;gap:14px;margin:0 0 14px;flex-wrap:wrap}#kjo .hint{margin:0!important;text-align:center;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);min-height:18px;transition:opacity .3s}
#kjo .stage{position:relative}
#kjo svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
#kjo .rec{cursor:pointer;outline:none}
#kjo .rec:focus-visible .vin{stroke:var(--gold);stroke-width:3}
#kjo .drop{animation:kjoDrop .7s cubic-bezier(.2,.8,.2,1)}
@keyframes kjoDrop{0%{opacity:0;transform:translateY(-120px) scale(.7)}100%{opacity:1;transform:none}}
#kjo .pbtn{cursor:pointer}
#kjo .crate{margin:26px auto 0;max-width:760px;background:linear-gradient(#1f1b15,#141109);border:1px solid rgba(178,157,117,.35);border-radius:6px;padding:22px 22px 0;position:relative}

#kjo .sleeves{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
#kjo .sl{position:relative;border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit;text-align:left;transition:transform .25s}
#kjo .sl:hover,#kjo .sl:focus-visible{transform:translateY(-10px);outline:none}
#kjo .sl .cv{position:relative;aspect-ratio:1;border-radius:3px;background:linear-gradient(145deg,#26211a,#110e09);border:1px solid rgba(178,157,117,.4);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;overflow:hidden;z-index:1}
#kjo .sl .cv:after{content:"";position:absolute;right:-30%;top:-30%;width:90%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(178,157,117,.25);box-shadow:0 0 0 14px rgba(178,157,117,.05),0 0 0 28px rgba(178,157,117,.04)}
#kjo .sl .disc{position:absolute;left:10%;top:-22%;width:80%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--lab) 0 17%,#000 18% 19%,#111 20% 100%);box-shadow:inset 0 0 0 1px #2b2b2b;transition:top .3s,opacity .3s;z-index:0}
#kjo .sl:hover .disc{top:-32%}
#kjo .sl .t{font-size:15px;font-weight:400;position:relative;z-index:2}
#kjo .sl .s{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);position:relative;z-index:2}
#kjo .sl.on .disc{opacity:0}
#kjo .sl.on .cv{opacity:.55}
#kjo .sl.on .s:after{content:" · läuft";color:var(--off)}
#kjo .front{height:26px;margin:0 -22px;margin-top:-6px;position:relative;z-index:3;background:linear-gradient(#2a241b,#171309);border-top:1px solid rgba(178,157,117,.35);border-radius:0 0 6px 6px;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:4px;color:var(--gold);text-transform:uppercase}
#kjo .panel{text-align:left;position:absolute;left:50%;top:50%;width:min(460px,92%);transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;background:rgba(20,17,12,.97);border:1px solid rgba(178,157,117,.4);border-top:2px solid var(--gold);padding:30px 30px 26px;transition:.35s;z-index:5;box-shadow:0 30px 60px rgba(0,0,0,.6)}
#kjo .panel.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
#kjo .panel .ey{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
#kjo .panel h3{font-size:30px;font-weight:300;margin:8px 0 10px;line-height:1.15;color:var(--off)}
#kjo .panel p{font-size:15px;line-height:1.65;color:var(--muted);margin:0 0 14px}
#kjo .panel ul{list-style:none;padding:0;margin:0 0 20px}
#kjo .panel li{font-size:15px;font-weight:300;padding:5px 0 5px 22px;position:relative}
#kjo .panel li:before{content:"";position:absolute;left:0;top:13px;width:10px;height:1px;background:var(--gold)}
#kjo .panel .bt{display:flex;gap:10px;flex-wrap:wrap}
#kjo .panel a{display:inline-block;padding:13px 20px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;border-radius:2px;transition:.2s}
#kjo .panel a.p{background:var(--gold);color:var(--b1)} #kjo .panel a.p:hover{background:var(--gold2)}
#kjo .panel a.s{border:1px solid var(--off);color:var(--off)} #kjo .panel a.s:hover{background:var(--off);color:var(--b1)}
#kjo .panel .x{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
#kjo .panel .resume{background:none;border:0;color:var(--gold);font:inherit;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;margin-top:14px;padding:0}
#kjo .snd{background:none;border:1px solid rgba(178,157,117,.35);color:var(--muted);font:inherit;font-size:11px;letter-spacing:2px;padding:5px 9px;cursor:pointer;border-radius:2px}
@media(max-width:767px){#kjo .sleeves{gap:8px}#kjo .sl .cv{padding:7px}#kjo .sl .t{font-size:12px}#kjo .sl .s{font-size:8px;letter-spacing:1px}#kjo .sl.on .s:after{content:""}#kjo .front{font-size:8px;letter-spacing:2px}#kjo .crate{padding:18px 14px 0}#kjo .front{margin:0 -14px}#kjo .panel{position:fixed;top:auto;bottom:12px;transform:translate(-50%,20px);width:calc(100% - 24px)}#kjo .panel.show{transform:translate(-50%,0)}#kjo .hint{font-size:11px;letter-spacing:2px}}
</style>
