name: Medienliste aktualisieren

# Nur auf Knopfdruck: Actions -> "Medienliste aktualisieren" -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install paramiko
      - name: Uploads per SFTP auslesen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_WP_CONTENT: ${{ secrets.SFTP_WP_CONTENT }}
        run: python3 tools/medien_liste.py
      - name: docs/MEDIEN.md committen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/MEDIEN.md
          git diff --cached --quiet || (git commit -m "Medienliste aktualisiert" && git push)
