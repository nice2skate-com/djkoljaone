name: "Social: Reel posten"

# Manuell (GitHub → Actions → „Social: Reel posten“ → Run workflow), durch Claude oder aus WordPress → Social.
#   pruefen  = nur Verbindung zu Facebook-Seite und Instagram testen
#   vorschau = Video aufbereiten (1080×1920, optional Musik) und auf dj-kolja-one.de ablegen – nichts veröffentlichen
#   posten   = aufbereiten, ablegen und auf Instagram/Facebook veröffentlichen
on:
  workflow_dispatch:
    inputs:
      aktion:
        description: "pruefen, vorschau oder posten"
        type: choice
        options: [pruefen, vorschau, posten]
        default: pruefen
      ziele:
        description: "Wohin? (nur bei posten)"
        type: choice
        options: ["instagram,facebook", "instagram", "facebook"]
        default: "instagram,facebook"
      video:
        description: "Video: Pfad im Repo oder https-Adresse, MP4, MOV oder HTML-Animation aus Claude Motion"
        default: "media/motion/export/reel_dj-kolja-one_1080x1920_social.mp4"
      musik:
        description: "Optional: eigene Musik (MP3/M4A/WAV) – Pfad im Repo oder https-Adresse"
        default: ""
      musik_start:
        description: "Ab Sekunde im Song"
        default: "0"
      originalton:
        description: "Originalton des Videos, wenn Musik darunterliegt"
        type: choice
        options: [aus, leise]
        default: aus
      dauer:
        description: "Nur bei HTML: Länge in Sekunden (auto = alle Szenen)"
        default: "auto"
      text_datei:
        description: "Begleittext aus Datei im Repo"
        default: "social/texte/reel-start.txt"
      text:
        description: "Oder Begleittext direkt (überschreibt die Datei)"
        default: ""

concurrency: social-reel

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: lftp und ffmpeg installieren
        if: ${{ inputs.aktion != 'pruefen' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp ffmpeg

      - name: Chromium zum Rendern installieren (nur bei HTML)
        if: ${{ inputs.aktion != 'pruefen' && (endsWith(inputs.video, '.html') || endsWith(inputs.video, '.htm')) }}
        run: npm install -g playwright@1.56.1 && playwright install --with-deps chromium

      - name: Video aufbereiten (und Musik darunterlegen)
        id: mix
        if: ${{ inputs.aktion != 'pruefen' }}
        env:
          VIDEO: ${{ inputs.video }}
          MUSIK: ${{ inputs.musik }}
          START: ${{ inputs.musik_start }}
          ORIGINALTON: ${{ inputs.originalton }}
          DAUER: ${{ inputs.dauer }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_WP_CONTENT: ${{ secrets.SFTP_WP_CONTENT }}
        run: |
          # Dateien von dj-kolja-one.de per SFTP holen: Songs sind per Download-Schutz (.htaccess) für Aufrufe von außen gesperrt
          sftp_holen() {
            local rel
            rel="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.unquote(urllib.parse.urlsplit(sys.argv[1]).path))' "$1")"
            rel="${rel#/wp-content/}"
            case "$rel" in *..*|*'"'*) return 1;; esac
            lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set sftp:auto-confirm yes
          get "$SFTP_WP_CONTENT/$rel" -o "$2"
          bye
          LFTP
          }
          holen() {
            case "$1" in
              https://dj-kolja-one.de/wp-content/*) sftp_holen "$1" "$2";;
              https://*) curl -fsSL --max-time 300 -o "$2" "$1";;
              *) [ -f "$1" ] && cp "$1" "$2";;
            esac
          }
          mkdir -p /tmp/reel
          EXT="${VIDEO##*.}"; EXT="${EXT%%\?*}"
          holen "$VIDEO" "/tmp/reel/eingang.$EXT" || { echo "::error::Video nicht gefunden: $VIDEO"; exit 1; }
          case "$EXT" in html|htm|HTML|HTM)
            # Claude-Motion-Animation Bild für Bild rendern (hochkant 1080×1920, 30 fps), dann zu MP4 zusammensetzen
            node social/motion_render.js "/tmp/reel/eingang.$EXT" /tmp/reel/bilder "${DAUER:-auto}" 30
            ffmpeg -v error -y -framerate 30 -i /tmp/reel/bilder/%05d.jpg -c:v libx264 -crf 18 -pix_fmt yuv420p /tmp/reel/eingang.mp4
            EXT=mp4;;
          esac
          ARGS=()
          if [ -n "$MUSIK" ]; then
            MEXT="${MUSIK##*.}"; MEXT="${MEXT%%\?*}"
            holen "$MUSIK" "/tmp/reel/musik.$MEXT" || { echo "::error::Musik nicht gefunden: $MUSIK"; exit 1; }
            ARGS+=(--musik "/tmp/reel/musik.$MEXT" --start "${START:-0}" --originalton "$ORIGINALTON")
          fi
          NAME="$(basename "${VIDEO%%\?*}")"; NAME="${NAME%.*}"
          [ -n "$MUSIK" ] && NAME="$NAME-musik"
          OUT="/tmp/reel/${GITHUB_RUN_ID}-${NAME}.mp4"
          python3 social/video_mischen.py "/tmp/reel/eingang.$EXT" "$OUT" "${ARGS[@]}"
          echo "datei=$OUT" >> "$GITHUB_OUTPUT"

      - name: Video auf dj-kolja-one.de ablegen
        id: video
        if: ${{ inputs.aktion != 'pruefen' }}
        env:
          DATEI: ${{ steps.mix.outputs.datei }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_WP_CONTENT: ${{ secrets.SFTP_WP_CONTENT }}
        run: |
          NAME="$(basename "$DATEI")"
          # Ordner wird vom Plugin nach 14 Tagen aufgeräumt (kjo-social.php)
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set sftp:auto-confirm yes
          mkdir -fp $SFTP_WP_CONTENT/uploads/kjo-social
          put "$DATEI" -o $SFTP_WP_CONTENT/uploads/kjo-social/$NAME
          bye
          LFTP
          URL="https://dj-kolja-one.de/wp-content/uploads/kjo-social/$NAME"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -I "$URL")
          [ "$CODE" = "200" ] || { echo "::error::Video ist unter $URL nicht erreichbar (HTTP $CODE)."; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          printf '## Video\n%s\n\nIn WordPress → Social erscheint es als „GitHub: %s“.\n' "$URL" "$NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Bei Meta prüfen bzw. veröffentlichen
        if: ${{ inputs.aktion != 'vorschau' }}
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          AKTION: ${{ inputs.aktion }}
          ZIELE: ${{ inputs.ziele }}
          VIDEO_URL: ${{ steps.video.outputs.url }}
          TEXT_DATEI: ${{ inputs.text_datei }}
          TEXT: ${{ inputs.text }}
        run: |
          python3 social/meta_reel.py "$AKTION" --video-url "$VIDEO_URL" --text-datei "$TEXT_DATEI" --text "$TEXT" --ziele "$ZIELE"
