name: Song-Kommentar anstoßen

# Dienstags 16:03–19:58 UTC (Winterzeit 17:03–20:58, Sommerzeit 18:03–21:58 Uhr) alle 5 Minuten die Website aufrufen, damit WordPress den ersten
# Instagram-Kommentar pünktlich schreibt (Social → Song-Kommentar; bis zu 6 Versuche im Abstand von 20 Minuten).
# Alle 5 statt alle 20 Minuten, weil GitHub geplante Läufe oft verspätet oder gar nicht startet (27.10.: 1 von 9).
# GitHub rechnet in UTC: 16–19 Uhr UTC deckt Sommer- und Winterzeit ab; ungerade Minuten, weil volle Minuten überlastet sind.
# Zu früh oder zu oft ist harmlos: Die Website prüft Uhrzeit und Abstand selbst.
on:
  schedule:
    - cron: "3-58/5 16-19 * * 2"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Website aufrufen
        run: curl -fsS -o /dev/null -w "%{http_code}\n" "https://dj-kolja-one.de/?kjo_kom=$(date +%s)" || true
