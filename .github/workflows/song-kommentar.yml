name: Song-Kommentar anstoßen

# Dienstags um 18:10–18:40 Uhr (deutsche Zeit) die Website aufrufen, damit WordPress den ersten Instagram-Kommentar
# pünktlich schreibt (Social → Song-Kommentar). GitHub rechnet in UTC: 16:xx = Sommerzeit, 17:xx = Winterzeit.
# Zu früh ist harmlos: Die Website prüft die eingestellte Uhrzeit selbst.
on:
  schedule:
    - cron: "10,20,40 16,17 * * 2"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Website aufrufen
        run: curl -fsS -o /dev/null -w "%{http_code}\n" "https://dj-kolja-one.de/?kjo_kom=$(date +%s)" || true
